name: Release Desktop Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.6)"
        required: true
        type: string
      notes:
        description: "Release notes"
        required: false
        type: string
        default: ""

jobs:
  build-and-release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump desktop version
        working-directory: apps/desktop
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ inputs.version }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Write packaged sidecar env
        run: |
          # These names must match what the code reads. They were AI_CREDITS_* until the
          # source was renamed to OPENAI_* and this file was not, so every line here was
          # silently inert: the sidecar fell back to calling api.openai.com with no key.
          #
          # No OPENAI_BASE_URL and no OPENAI_API_KEY on purpose. Their absence is the signal
          # that makes the sidecar route LLM calls through YOMI_BACKEND_URL/api/llm/proxy,
          # authenticated with the signed-in user's session token, with the backend injecting
          # the real key. Setting either one here would send the proxy an unauthenticated
          # request and get a 401.
          #
          # SIDECAR_SECRET is what /api/stt and /api/tts authenticate on. It was never
          # written here, so packaged builds sent no x-sidecar-secret header and every
          # speech call 401'd: voice input and spoken replies did not work for any user.
          $lines = @(
            "SIDECAR_SECRET=${{ secrets.SIDECAR_SECRET }}"
            "OPENAI_FAST_MODEL=${{ secrets.AI_CREDITS_FAST_MODEL }}"
            "OPENAI_AGENT_MODEL=${{ secrets.AI_CREDITS_AGENT_MODEL }}"
            "OPENAI_EMBEDDING_MODEL=text-embedding-3-small"
            "ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}"
            "ELEVENLABS_STT_MODEL=scribe_v2"
            "ELEVENLABS_TTS_MODEL=eleven_flash_v2_5"
            "TTS_ENGINE=elevenlabs"
            "YOMI_BACKEND_URL=https://api.getyomi.in"
            "BACKEND_URL=https://api.getyomi.in"
          )
          $lines -join "`n" | Set-Content .env -NoNewline

      - name: Build sidecar (Windows x64)
        working-directory: apps/sidecar
        run: bun run build

      - name: Build Electron app
        working-directory: apps/desktop
        run: bunx electron-vite build

      - name: Build installer & publish to yomi-releases
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bunx electron-builder --config electron-builder.yml --win --publish always
