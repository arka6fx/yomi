name: Release

# Cuts a release PR (and later a tagged GitHub Release + CHANGELOG update) from
# conventional commits whenever a commit lands on main. Release-please
# maintains the version drift; the release PR is the manual gate before a tag
# is pushed. There is no npm publication - releases exist so contributors get
# versioned milestones and diffable changelogs.
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable commit SHA, not the mutable tag. See
      # deploy-landing.yml for the pinning policy rationale. The canonical
      # action moved from google-github-actions to googleapis; `default-branch`
      # was never a valid input (the old action ignores it, the new one rejects
      # it), the branch is implied by release-type/config-file = main.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node
