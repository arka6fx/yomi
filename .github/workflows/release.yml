name: Release Desktop Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.6)"
        required: true
        type: string
      notes:
        description: "Release notes"
        required: false
        type: string
        default: ""

jobs:
  build-and-release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump desktop version
        working-directory: apps/desktop
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ inputs.version }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Write packaged sidecar env
        run: |
          $lines = @(
            "AI_CREDITS_BASE_URL=https://api.yomi.arka6fx.com/api/llm/proxy"
            "AI_CREDITS_FAST_MODEL=${{ secrets.AI_CREDITS_FAST_MODEL }}"
            "AI_CREDITS_AGENT_MODEL=${{ secrets.AI_CREDITS_AGENT_MODEL }}"
            "AI_CREDITS_EMBEDDING_MODEL=text-embedding-3-small"
            "ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}"
            "ELEVENLABS_STT_MODEL=scribe_v2"
            "ELEVENLABS_TTS_MODEL=eleven_flash_v2_5"
            "YOMI_BACKEND_URL=https://api.yomi.arka6fx.com"
            "BACKEND_URL=https://api.yomi.arka6fx.com"
          )
          $lines -join "`n" | Set-Content .env -NoNewline

      - name: Build sidecar (Windows x64)
        working-directory: apps/sidecar
        run: bun run build

      - name: Build Electron app
        working-directory: apps/desktop
        run: bunx electron-vite build

      - name: Build installer & publish to yomi-releases
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bunx electron-builder --config electron-builder.yml --win --publish always
