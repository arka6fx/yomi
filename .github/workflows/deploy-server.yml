name: Deploy Server (Python backend on Cloudflare Containers)

# The FastAPI port of the backend deploys as a Cloudflare Container: the image
# in server/Dockerfile (uvicorn on :8080) is built on the runner, pushed to the
# Cloudflare Registry, and routed through the tiny Containers Worker in
# server/containers (server/wrangler.toml). The existing api.getyomi.in Worker
# (apps/backend) stays untouched until the cutover is done.
#
# Secrets are Worker Secrets (wrangler secret put), never in this file or in
# [vars] — see server/README.md "Deploying to Cloudflare Containers".
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('server/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  deploy:
    name: build + deploy container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cancel-in-progress is false so runs queue instead of racing, but a run
      # queued behind another can still be for a commit main has since moved
      # past. Bail here so only the run for the current tip deploys.
      - name: Skip if main has moved past this commit
        id: staleness
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" != "${{ github.sha }}" ]; then
            echo "main is now at $latest_sha, this run was queued for ${{ github.sha }} — skipping deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup bun
        if: steps.staleness.outputs.stale != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Containers worker deps
        if: steps.staleness.outputs.stale != 'true'
        working-directory: server/containers
        run: bun install --frozen-lockfile

      - name: Typecheck Containers worker
        if: steps.staleness.outputs.stale != 'true'
        working-directory: server/containers
        run: bun run typecheck

      # wrangler builds server/Dockerfile (linux/amd64) with the runner's Docker
      # and pushes to the Cloudflare Registry, then rolls out container
      # instances. First deploy can take a few minutes to provision.
      # Runs only once CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets are
      # configured in the repo; until then the job passes via skip.
      - name: Deploy to Cloudflare Containers
        if: ${{ steps.staleness.outputs.stale != 'true' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      # Health check only runs when YOMI_SERVER_URL is configured (set once the
      # Workers domain / custom domain for the server Worker is known).
      - name: Health check
        if: ${{ steps.staleness.outputs.stale != 'true' && secrets.YOMI_SERVER_URL != '' }}
        env:
          YOMI_SERVER_URL: ${{ secrets.YOMI_SERVER_URL }}
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -m 15 "$YOMI_SERVER_URL/health" && exit 0
            sleep 10
          done
          echo "health check failed"; exit 1