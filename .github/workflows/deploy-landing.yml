name: Deploy Landing

# apps/landing deploys as a Cloudflare Worker (yomi-landing). NEXT_PUBLIC_* are
# baked in at build time, so they're set here rather than in wrangler.jsonc's
# vars (which only apply at runtime). Values match SETUP_GUIDE.md's documented
# manual deploy — public URLs, not secrets.
on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BACKEND_URL: https://api.getyomi.in
      NEXT_PUBLIC_API_URL: https://api.getyomi.in
      NEXT_PUBLIC_APP_URL: https://getyomi.in
    steps:
      - uses: actions/checkout@v4

      # Pinned to an immutable commit SHA, not the mutable `v2` tag — this step
      # runs before the Cloudflare secrets are in scope (see below), but pinning
      # third-party actions is the general rule regardless of what runs after.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # CLOUDFLARE_API_TOKEN/ACCOUNT_ID are scoped to this step only, not the
      # job-level env, so earlier steps (checkout, setup-bun, install) never
      # have them in their process environment.
      - name: Build, deploy, and smoke-test
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:production
