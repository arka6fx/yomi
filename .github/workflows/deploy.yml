name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/yomi
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/arka6fx/yomi.git
            git pull origin main
            sudo docker compose up -d --build backend landing
            sudo docker compose restart nginx
            sudo docker image prune -f
