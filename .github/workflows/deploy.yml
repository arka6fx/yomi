name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/yomi
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/arka6fx/yomi.git
            git pull origin main
            
            # Strip previously injected gateway lines to avoid duplication
            sed -i '/^# --- Injected by deploy workflow ---/,$d' .env.production
            
            # Inject gateway secrets into .env.production
            echo "" >> .env.production
            echo "# --- Injected by deploy workflow ---" >> .env.production
            echo "YOMI_PLAN=max" >> .env.production
            echo "SIDECAR_SECRET=${{ secrets.SIDECAR_SECRET }}" >> .env.production
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env.production
            echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" >> .env.production
            echo "DISCORD_CLIENT_ID=1513769981773480068" >> .env.production
            echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> .env.production
            echo "DISCORD_REDIRECT_URI=https://yomi.arka6fx.com/api/gateway/discord/callback" >> .env.production
            echo "RAZORPAY_PLAN_PRO=${{ secrets.RAZORPAY_PLAN_PRO }}" >> .env.production
            echo "RAZORPAY_PLAN_MAX=${{ secrets.RAZORPAY_PLAN_MAX }}" >> .env.production
            echo "NEXT_PUBLIC_DISCORD_INVITE=https://discord.gg/R8s4qBVwK8" >> .env.production
            echo "TELEGRAM_DEEP_LINK_ENABLED=true" >> .env.production
            echo "TELEGRAM_BOT_USERNAME=yomi_assistant_bot" >> .env.production

            sudo docker compose up -d --build backend landing
            sudo docker compose restart nginx
            sudo docker image prune -f
