name: Migrate Prod On Push

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-prod-on-push.yml"
      - "packages/db/scripts/prod-apply-0038-0039.ts"

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  # Temporary prod migration runner; remove after /health/db is green.
  migrate:
    runs-on: [self-hosted, yomi-ec2]
    steps:
      - uses: actions/checkout@v4

      - name: Sync code into ~/yomi
        run: |
          if ! command -v rsync >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq rsync; fi
          rsync -a --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.env.production*' \
            "$GITHUB_WORKSPACE"/ /home/ubuntu/yomi/

      - name: Rebuild backend with latest migrations
        run: |
          cd /home/ubuntu/yomi
          docker compose up -d --build backend
          sleep 6

      - name: Apply migrations 0038 and 0039
        continue-on-error: true
        run: |
          cd /home/ubuntu/yomi
          docker compose exec -T backend sh -lc 'cd /app/packages/db && PROD_MIGRATION_REPORT=/tmp/prod-migration-report.md bun scripts/prod-apply-0038-0039.ts'

      - name: Commit migration report
        if: always()
        run: |
          cd /home/ubuntu/yomi
          mkdir -p docs
          docker compose cp backend:/tmp/prod-migration-report.md docs/prod-migration-report.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prod-migration-report.md
          git commit -m "chore: record prod migration report" || true
          git push || true

      - name: Confirm database health
        run: |
          curl -fsS -m 20 https://api.getyomi.in/health/db
