name: Deploy Backend

# Backend deploys as a Cloudflare Worker (yomi-backend, production env) served
# at api.getyomi.in via a Workers custom domain. Secrets live in Cloudflare
# (wrangler secret), NEVER in vars or this file. This replaced the old EC2
# self-hosted runner path when the AWS infrastructure was retired.
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # cancel-in-progress is false so runs queue instead of racing, but a run
      # that was queued behind another can still be for a commit main has
      # since moved past. Bail here so only the run for the current tip deploys.
      - name: Skip if main has moved past this commit
        id: staleness
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" != "${{ github.sha }}" ]; then
            echo "main is now at $latest_sha, this run was queued for ${{ github.sha }} — skipping deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.staleness.outputs.stale != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.staleness.outputs.stale != 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.staleness.outputs.stale != 'true'
        run: bun run typecheck

      - name: Test
        if: steps.staleness.outputs.stale != 'true'
        run: bun run test

      - name: Docs sync check
        if: steps.staleness.outputs.stale != 'true'
        run: bun run docs:check

      - name: Deploy backend Worker
        if: steps.staleness.outputs.stale != 'true'
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:production

      - name: Health check
        if: steps.staleness.outputs.stale != 'true'
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -m 15 https://api.getyomi.in/health && exit 0
            sleep 5
          done
          echo "health check failed"; exit 1
