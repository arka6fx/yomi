name: Deploy Backend (Python Container)

# The FastAPI Python backend deploys as a Cloudflare Container (yomi-backend).
# This is the sole backend — the TS Hono Worker has been retired.
# The image in apps/api/Dockerfile (uvicorn on :8080) is built on the
# runner, pushed to the Cloudflare Registry, and routed through the thin Worker
# in apps/api/containers (apps/api/wrangler.toml).
#
# Secrets are Worker Secrets (wrangler secret put), never in this file.
# See apps/api/README.md for the full secret list.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/api/uv.lock', 'packages/db/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  deploy:
    name: build + deploy container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Skip if main has moved past this commit
        id: staleness
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" != "${{ github.sha }}" ]; then
            echo "main is now at $latest_sha, this run was queued for ${{ github.sha }} — skipping."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.staleness.outputs.stale != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install containers worker deps
        if: steps.staleness.outputs.stale != 'true'
        working-directory: apps/api/containers
        run: npm ci

      - name: Typecheck containers worker
        if: steps.staleness.outputs.stale != 'true'
        working-directory: apps/api/containers
        run: npm run typecheck

      - name: Check deploy secrets
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOMI_SERVER_URL: ${{ secrets.YOMI_SERVER_URL }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cf_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "cf_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$YOMI_SERVER_URL" ]; then
            echo "url_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "url_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Containers
        if: ${{ steps.staleness.outputs.stale != 'true' && steps.creds.outputs.cf_available == 'true' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Health check
        if: ${{ steps.staleness.outputs.stale != 'true' && steps.creds.outputs.url_available == 'true' }}
        env:
          YOMI_SERVER_URL: ${{ secrets.YOMI_SERVER_URL }}
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -m 15 "$YOMI_SERVER_URL/health" && exit 0
            sleep 10
          done
          echo "health check failed"; exit 1
