name: Python backend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['apps/backend/**', 'packages/db/**']
  push:
    branches: [main]
    paths: ['apps/backend/**', 'packages/db/**']

jobs:
  python:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend

    steps:
      # Pinned to immutable commit SHAs, not mutable tags — see
      # deploy-landing.yml for the pinning policy rationale.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/backend/uv.lock', 'packages/db/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q