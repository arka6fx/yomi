name: Python backend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['apps/api/**', 'packages/db/**']
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/db/**']

jobs:
  python:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    steps:
      # Pinned to immutable commit SHAs, not mutable tags — see
      # deploy-landing.yml for the pinning policy rationale.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/api/uv.lock', 'packages/db/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
