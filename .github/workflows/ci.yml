name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: PR quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Pinned to immutable commit SHAs, not mutable tags — see
      # deploy-landing.yml for the pinning policy rationale.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache dependencies and turbo run cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            node_modules/.cache/turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check lockfile
        run: |
          if ! git diff --exit-code bun.lock; then
            echo "::error::bun.lock is out of date. Run 'bun install' and commit the changes."
            exit 1
          fi

      # Never ran here before, so formatting drifted across 269 files unnoticed while
      # `format:check` also failed locally for an unrelated reason (CRLF checkout) that
      # masked it.
      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Docs sync
        run: bun run docs:check

      - name: Build
        run: bun run build:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Test with coverage
        run: bun run coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            apps/backend/coverage
            apps/landing/coverage
            packages/db/coverage
            packages/shared/coverage
            packages/agent-core/coverage
            packages/ui-connectors/coverage
          if-no-files-found: ignore
