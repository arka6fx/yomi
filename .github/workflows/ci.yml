name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Python backend (FastAPI container) ──────────────────────────────────────
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/backend/uv.lock', 'packages/db/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # ── TypeScript / Next.js (landing + packages) ───────────────────────────────
  quality:
    name: Frontend lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Pinned to immutable commit SHAs — see deploy-landing.yml for policy.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache turbo run cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Check lockfile
        run: |
          if ! git diff --exit-code package-lock.json; then
            echo "::error::package-lock.json is out of date. Run 'npm install' and commit."
            exit 1
          fi

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Docs sync
        run: npm run docs:check

      - name: Build
        run: npm run build:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            apps/landing/coverage
            packages/shared/coverage
            packages/ui-connectors/coverage
          if-no-files-found: ignore
