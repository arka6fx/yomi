name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Python backend (FastAPI container) ──────────────────────────────────────
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/backend/uv.lock', 'packages/db/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # ── TypeScript / Next.js (landing + packages) ───────────────────────────────
  quality:
    name: Frontend lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Pinned to immutable commit SHAs — see deploy-landing.yml for policy.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache turbo run cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Check lockfile
        run: |
          if ! git diff --exit-code package-lock.json; then
            echo "::error::package-lock.json is out of date. Run 'npm install' and commit."
            exit 1
          fi

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Docs sync
        run: npm run docs:check

      - name: Build
        run: npm run build:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            apps/landing/coverage
            packages/shared/coverage
            packages/ui-connectors/coverage
          if-no-files-found: ignore
