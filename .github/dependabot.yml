version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      runtime:
        patterns:
          ["@yomi/*", "ai", "hono", "better-auth", "drizzle-orm", "next", "react", "react-dom"]
      dev:
        patterns: ["eslint", "prettier", "typescript", "turbo", "wrangler", "drizzle-kit"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
