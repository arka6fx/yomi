name: Bug report
description: Something in Yomi is broken or behaves unexpectedly
labels: [needs-triage, bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A short, focused description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Be specific. Include the connector/action involved if applicable.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit this?
      options:
        - Telegram
        - Web dashboard / account linking
        - Billing / plans / credits
        - API / backend
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Paste sanitized output. Redact any personal data before submitting.