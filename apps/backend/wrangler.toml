name            = "yomi-backend"
main            = "src/index.ts"
compatibility_date  = "2025-05-22"
compatibility_flags = ["nodejs_compat"]

[vars]
# Non-secret env vars — override per environment below
BETTER_AUTH_URL = "https://yomi.app"

# Secrets — set once via CLI, never committed:
#   wrangler secret put DATABASE_URL
#   wrangler secret put BETTER_AUTH_SECRET
#   wrangler secret put RAZORPAY_KEY_ID
#   wrangler secret put RAZORPAY_KEY_SECRET
#   wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put ELEVENLABS_API_KEY

[env.preview]
name = "yomi-backend-preview"

[env.preview.vars]
BETTER_AUTH_URL = "https://preview.yomi.app"
