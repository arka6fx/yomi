# Production storage gateway. Staging equivalent: wrangler.storage.toml.
# Production API traffic still uses wrangler.toml until the route cutover.
name = "yomi-storage"
main = "containers/storage-worker.ts"
compatibility_date = "2026-09-22"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "yomi-prod"
database_id = "57a0dc01-d86f-4456-b1b3-a9e813537751"
migrations_dir = "migrations-d1"

[[vectorize]]
binding = "VECTORS"
index_name = "yomi-vectors-768"

# Temp Drive-sync content (R2; Workers Paid).
[[r2_buckets]]
binding = "R2_INGEST"
bucket_name = "yomi-ingest"

# User uploads such as profile pictures, served via /api/media on the API.
[[r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "yomi-media"

# Configure with: npx wrangler secret put STORAGE_GATEWAY_SECRET -c ../wrangler.storage-prod.toml
