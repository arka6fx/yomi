name = "yomi-backend"
main = "containers/worker.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Only non-secret config here. Every secret lives as a Worker Secret
# (see README.md "Deploying to Cloudflare Containers") and is forwarded
# to the container through the envVars mapping in containers/worker.ts.
[vars]
ENVIRONMENT = "production"
APP_URL = "https://getyomi.in"
BACKEND_URL = "https://api.getyomi.in"
WEB_ORIGIN = "https://getyomi.in"
CORS_ORIGIN = "https://getyomi.in"
CLOUDFLARE_ACCOUNT_ID = "fd75a1445f24dfdad463df40c093f667"

[[containers]]
max_instances = 2
class_name = "YomiContainer"
image = "./Dockerfile"
image_build_context = "../../"

[[durable_objects.bindings]]
name = "YOMI_CONTAINER"
class_name = "YomiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["YomiContainer"]

# Orphan-run sweeper (see scheduled() in containers/worker.ts): cheap enough
# to run frequently since it exits fast with nothing to do.
[triggers]
crons = ["*/10 * * * *"]