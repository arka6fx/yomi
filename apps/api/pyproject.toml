[project]
name = "yomi-backend"
version = "0.1.0"
description = "Yomi AI assistant — Python FastAPI backend on Cloudflare Containers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    "aiobotocore>=2.15.0",   # R2 / S3-compatible object storage
    "python-multipart>=0.0.9", # file upload support (voice, images)
    "yomi-db",              # shared schema (packages/db) — see [tool.uv.sources]
    "composio>=0.21.1",
]


[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yomi"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# yomi is a PEP 420 namespace split across this app and the packages/db
# distribution; pin the whole namespace as first-party so isort doesn't treat
# `yomi.db` as third-party.
known-first-party = ["yomi"]

[tool.ruff.lint.per-file-ignores]
# Prompt text ported verbatim from contradiction.ts; long lines are the rules
# themselves and must not be rewrapped.
"src/yomi/services/memory/contradiction.py" = ["E501"]
# Ported/generated code — line length and raise-from relaxed until cleaned up.
"src/yomi/gateway/*.py" = ["E501", "B904"]
"src/yomi/services/agent/*.py" = ["E501", "B904"]
"src/yomi/services/browser.py" = ["E501"]
"src/yomi/services/oauth.py" = ["E501", "B904"]
"src/yomi/app/routes/integrations.py" = ["B904"]
"src/yomi/app/routes/custom_mcp.py" = ["B904"]
# Connector ported from TS — tool descriptions are model-facing prompt text and
# must not be rewrapped to fit 100 chars.
"src/yomi/connectors/*.py" = ["E501"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv.sources]
# Shared schema lives in packages/db; `../../` reaches up from apps/api.
yomi-db = { path = "../../packages/db" }
