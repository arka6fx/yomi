appId: com.yomi.app
productName: Yomi
copyright: Copyright © 2026 Yomi

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/*.test.*"
  - "!node_modules/.vite/**"

extraMetadata:
  main: out/main/index.js

asar: true
compression: maximum

extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: ../sidecar/dist/
    to: sidecar
    filter:
      - sidecar-win32-x64.exe
  - from: ../../.env
    to: sidecar/.env
win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  signExts: []
  signtoolOptions:
    sign: build/win-sign-noop.cjs

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true

mac:
  category: public.app-category.productivity
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  category: Utility
  target:
    - AppImage

publish:
  provider: github
  owner: arka6fx
  repo: yomi-releases
  releaseType: release
