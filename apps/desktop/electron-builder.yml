appId: com.yomi.app
productName: Yomi
copyright: Copyright © 2025 Yomi

directories:
  output: release

extraResources:
  - from: ../sidecar/dist/
    to: sidecar
  - from: ../uia-helper/dist/
    to: uia

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  releaseType: release
