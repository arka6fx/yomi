services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/letsencrypt:ro
      - ./deploy/logs:/var/log/nginx
    depends_on:
      - backend
      - landing
    restart: unless-stopped
    networks:
      - yomi-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.production
    environment:
      - PORT=3001
      - NODE_ENV=production
      - SIDECAR_SECRET=***PURGED-LEAKED-SECRET***
      - SIDECAR_URL=http://sidecar:3002
      - YOMI_PLAN=max
      - TELEGRAM_BOT_TOKEN=***PURGED-LEAKED-SECRET***
      - DISCORD_BOT_TOKEN=***PURGED-LEAKED-SECRET***
      - WHATSAPP_ACCESS_TOKEN=EAAZCVCB8ZBRjoBRr9k09IQD6B5X9CAgw5gIfTSZBVPIpdBYAwKH7A2QOKfJ3gzmYepQtaILydus8ybp2ZC2n8F5bKT95JKgfU6V1NCRby68STeIAi8VyXF5PRHnqPQaQqR3ucv77zBPGXCrZAZBiQAVNnMvIFkYXZA8PCfyWGxqpaZBeMc5b9swWpN7XT5VWDscqQmqGqnUpVIb3DUSVHH2rNmLDkNncGN71afHI4Y7kwjj43nZCs9bRenvs5q1h3YQ5kds2IwSKWV1a1gR1c4LBP
      - WHATSAPP_PHONE_NUMBER_ID=1151344804725583
    restart: unless-stopped
    networks:
      - yomi-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://yomi.arka6fx.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://yomi.arka6fx.com}
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - yomi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  yomi-net:
    driver: bridge
