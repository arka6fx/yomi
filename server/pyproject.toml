[project]
name = "yomi-backend"
version = "0.1.0"
description = "Yomi AI assistant backend — FastAPI port of apps/backend (Hono on Cloudflare Workers)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    "openai>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yomi"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Model classes mirror the drizzle schema one-for-one; column declarations stay
# single-line so they're diffable against schema.ts.
"src/yomi/db/models_*.py" = ["E501"]
# Prompt text ported verbatim from contradiction.ts; long lines are the rules
# themselves and must not be rewrapped.
"src/yomi/services/memory/contradiction.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv.sources]