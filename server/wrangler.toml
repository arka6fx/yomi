name = "yomi-server"
main = "containers/worker.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Only non-secret config here. Every secret lives as a Worker Secret
# (see server/README.md "Deploying to Cloudflare Containers") and is forwarded
# to the container through the envVars mapping in containers/worker.ts.
[vars]
ENVIRONMENT = "production"

[[containers]]
max_instances = 2
class_name = "YomiContainer"
image = "./Dockerfile"

[[durable_objects.bindings]]
name = "YOMI_CONTAINER"
class_name = "YomiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["YomiContainer"]