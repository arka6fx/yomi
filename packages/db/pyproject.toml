[project]
name = "yomi-db"
version = "0.1.0"
description = "Yomi AI assistant — shared Postgres schema (SQLAlchemy 2 async models)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Build from src/yomi (not src/yomi/db) so the wheel keeps the `yomi` namespace
# and installs as site-packages/yomi/db alongside the backend's editable
# `yomi` portions (PEP 420 namespace merge).
packages = ["src/yomi"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["yomi"]

[tool.ruff.lint.per-file-ignores]
# Model classes mirror the drizzle schema one-for-one; column declarations stay
# single-line so they're diffable against schema.ts.
"src/yomi/db/models_*.py" = ["E501"]